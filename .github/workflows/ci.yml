# CI baseline for dsh-session-guard.
# Generated 2026-11-05; re-chained 2026-11-28 for the TypeScript rewrite.
#
# Chain: install -> build -> typecheck -> lint -> test -> lib-sync
# Rationale for the order:
#   * build FIRST: `lib/` is a committed artifact and tests import `../lib/*.js`,
#     so a stale build would silently test yesterday's code.
#   * typecheck before lint: a type error is the more precise signal.
#   * lib-sync LAST: it rebuilds into a temp dir and byte-compares against the
#     committed `lib/`, proving the artifact actually matches the sources.
# publish.yml is intentionally NOT included (npm secret is not uploaded to
# GitHub Actions; releases stay manual until Trusted Publishing is configured).

name: CI

on:
  push:
    branches: [main, 'refactor/*']
  pull_request: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm test
      - run: node _tools/gate-lib-sync.mjs
